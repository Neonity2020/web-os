<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>WebOS — 桌面</title>
  <meta http-equiv="Cache-Control" content="no-cache">
  <script>
    /* 托管环境不给静态资源设置 Cache-Control/ETag：主动核对版本，
       发现已发布新版本就换一个 URL 重载，清掉浏览器与边缘节点上的旧脚本。 */
    window.WEBOS_BUILD = '20261114-de7b24aa';
    (function () {
      if (/[?&]_wb=/.test(location.search)) return;
      try { if (sessionStorage.getItem('webos-build-check') === '1') return; } catch (e) { }
      fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (!v || !v.build || v.build === window.WEBOS_BUILD) return;
          try { sessionStorage.setItem('webos-build-check', '1'); } catch (e) { }
          var u = new URL(location.href);
          u.searchParams.set('_wb', v.build);
          location.replace(u.toString());
        })
        .catch(function () { });
    })();
  </script>
  <link rel="stylesheet" href="css/base.css?v=20261114-de7b24aa">
  <link rel="stylesheet" href="css/desktop.css?v=20261114-de7b24aa">
  <link rel="stylesheet" href="css/windows.css?v=20261114-de7b24aa">
  <link rel="stylesheet" href="css/apps.css?v=20261114-de7b24aa">
  <link rel="stylesheet" href="css/office.css?v=20261114-de7b24aa">
  <link rel="stylesheet" href="css/scicalc.css?v=20261114-de7b24aa">
  <link rel="stylesheet" href="css/mobile.css?v=20261114-de7b24aa">
  <link rel="stylesheet" href="css/auth.css?v=20261114-de7b24aa">
</head>
<body>
  <!-- 桌面壁纸 -->
  <div id="wallpaper" class="wallpaper"></div>
  <div class="wallpaper-vignette"></div>

  <!-- 桌面层 -->
  <main id="desktop" class="desktop">
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="desktop-widgets" class="desktop-widgets"></div>
    <div id="windows-layer" class="windows-layer"></div>
  </main>

  <!-- 菜单栏 -->
  <header id="menubar" class="menubar"></header>
  <div id="menu-layer" class="menu-layer"></div>

  <!-- 程序坞 -->
  <div id="dock-wrap" class="dock-wrap">
    <div id="dock" class="dock"></div>
  </div>

  <!-- 浮层 -->
  <div id="context-menu" class="context-menu hidden"></div>
  <div id="toast-stack" class="toast-stack"></div>
  <div id="spotlight" class="spotlight-overlay hidden"></div>
  <div id="launchpad" class="launchpad hidden"></div>
  <aside id="notification-center" class="notification-center"></aside>
  <div id="mission-bar" class="mission-bar hidden"></div>
  <div id="lockscreen" class="lockscreen hidden"></div>
  <div id="shutdown" class="shutdown hidden"></div>

  <!-- 开机 -->
  <div id="boot" class="boot">
    <div class="boot-logo" id="boot-logo"></div>
    <div class="boot-progress"><span></span></div>
    <div class="boot-hint">欢迎使用 WebOS</div>
  </div>

  <script src="js/core.js?v=20261114-de7b24aa"></script>
  <script src="js/window-manager.js?v=20261114-de7b24aa"></script>
  <script src="js/apps.js?v=20261114-de7b24aa"></script>
  <script src="js/office.js?v=20261114-de7b24aa"></script>
  <script src="js/scicalc.js?v=20261114-de7b24aa"></script>
  <script src="js/phoenix.js?v=20261114-de7b24aa"></script>
  <script src="js/desktop.js?v=20261114-de7b24aa"></script>
  <script src="js/cloud-config.js?v=20261114-de7b24aa"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="js/auth.js?v=20261114-de7b24aa"></script>
  <script src="js/main.js?v=20261114-de7b24aa"></script>
</body>
</html>
